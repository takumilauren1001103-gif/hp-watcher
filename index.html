<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HP電話番号監視</title>
<style>
:root{--bg:#faf9f7;--card:#fff;--line:#e3e1dc;--ink:#1c1b19;--dim:#6b6862;--faint:#9a968e;--go:#0d7d5f;--stop:#b03a2e;--warn:#9a6700}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.65;padding:0 16px 56px}.wrap{max-width:760px;margin:auto}header{padding:30px 0 18px;border-bottom:2px solid var(--ink);margin-bottom:22px}h1{font-size:21px;margin:0;display:flex;gap:10px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:var(--go)}header p{font-size:13px;color:var(--dim);margin:5px 0 0}.box{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}.box-t{padding:12px 15px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--dim);display:flex;align-items:center;justify-content:space-between;gap:10px}.box-b{padding:15px}.fld{margin-bottom:16px}.fld:last-child{margin:0}label{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:5px}input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font:inherit;color:var(--ink)}textarea{min-height:112px;line-height:1.45;resize:vertical}input:focus,textarea:focus{outline:2px solid var(--go);outline-offset:-1px;border-color:transparent}.two{display:flex;gap:10px}.two>*{flex:1}.add{display:flex;gap:8px}.add input{flex:1}.note,.sub{font-size:12px;color:var(--faint);margin-top:5px}.btn{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:7px;padding:10px 14px;cursor:pointer;white-space:nowrap;background:var(--go);color:#fff}.btn:disabled{opacity:.45;cursor:default}.btn-line{background:#fff;color:var(--dim);border:1px solid var(--line)}.btn-danger{background:none;color:var(--stop);padding:5px 8px}.btn-small{font-size:12px;padding:6px 9px}.msg{font-size:13px;min-height:1px;margin-top:8px}.bad{color:var(--stop)}.good{color:var(--go)}.tabs{display:flex;gap:6px;margin-bottom:12px}.tab{font:inherit;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;cursor:pointer;color:var(--dim)}.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}.row{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.row:last-child{border:0}.url{font-size:14px;word-break:break-all}.meta{font-size:12px;color:var(--faint);margin-top:3px}.actions{display:flex;gap:2px;flex:none}.empty{padding:28px 15px;text-align:center;color:var(--faint);font-size:13px}.recent{font-size:13px}.badge{display:inline-block;border-radius:20px;padding:2px 7px;font-size:11px;background:#eef6f3;color:var(--go);white-space:nowrap}.badge.err{background:#fdf0ee;color:var(--stop)}.badge.warn{background:#fff7e8;color:var(--warn)}#crash{display:none;background:#fdf0ee;border:1px solid var(--stop);color:var(--stop);border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap;margin:16px 0}.hide{display:none!important}@media(max-width:520px){.two,.add{display:block}.add .btn{margin-top:8px;width:100%}.actions{flex-wrap:wrap;justify-content:flex-end}}
</style>
</head>
<body><div class="wrap">
<div id="crash"></div>
<section id="setup">
<header><h1><span class="dot"></span>HP電話番号監視</h1><p>GitHubの設定・履歴を使って、公開ページを少しずつ巡回します。</p></header>
<div class="box"><div class="box-b">
<div class="fld"><label>GitHubユーザー名</label><input id="in-owner" placeholder="takumilauren1001103-gif" autocomplete="off"></div>
<div class="fld"><label>リポジトリ名</label><input id="in-repo" value="hp-watcher" autocomplete="off"></div>
<div class="fld"><label>Personal Access Token</label><input id="in-token" type="password" placeholder="github_pat_..." autocomplete="off"><div class="note">Contents の読み書き権限が必要です。値はこのブラウザの保存領域にだけ保管されます。</div></div>
<div class="fld two"><div><label>巡回間隔</label><input value="30分ごと（固定）" readonly></div><div><label>再通知抑止（分）</label><input id="in-cooldown" type="number" value="60" min="5" max="1440"></div></div>
<button class="btn" id="btn-connect" style="width:100%;margin-top:10px">接続してはじめる</button><div id="msg-setup" class="msg"></div>
</div></div>
</section>
<section id="main" class="hide">
<header><div style="display:flex;justify-content:space-between;gap:12px"><div><h1><span class="dot"></span>HP電話番号監視</h1><p id="summary">読み込み中...</p></div><button class="btn btn-line btn-small" id="btn-refresh">更新</button></div></header>
<div class="box"><div class="box-b">
<label>監視URLを追加</label><div class="add"><input id="in-url" placeholder="https://example.com/"><button class="btn" id="btn-add">追加</button></div><div class="msg" id="msg-url"></div>
<div class="fld" style="margin-top:18px"><label>URLをまとめて追加</label><textarea id="in-bulk" placeholder="1行に1件ずつ貼り付けてください&#10;https://example.com/&#10;https://example.jp/"></textarea><div class="note">最大120件。末尾スラッシュ・#以降だけが違うURLは重複として追加しません。</div><button class="btn btn-line" id="btn-bulk" style="margin-top:8px">まとめて追加</button></div>
</div></div>
<div class="tabs"><button class="tab on" id="tab-active">監視中</button><button class="tab" id="tab-notified">通知済み</button></div>
<div class="box" id="box-active"><div class="box-t"><span>監視中（<span id="n-active">0</span> / 120件）</span><span>全ページを少しずつ巡回</span></div><div id="list-active"></div></div>
<div class="box hide" id="box-notified"><div class="box-t"><span>通知済み（<span id="n-notified">0</span>件）</span><span>削除または監視復帰</span></div><div id="list-notified"></div></div>
<div class="box"><div class="box-t"><span>直近24時間の巡回</span><span id="n-recent">0件</span></div><div id="list-recent" class="recent"></div></div>
</section>
</div>
<script>
"use strict";
window.onerror=function(m,s,l,c){var e=document.getElementById("crash");e.style.display="block";e.textContent="画面エラー: "+m+" ("+l+":"+c+")";};
(function(){
var $=function(id){return document.getElementById(id);};
var cfg={owner:"",repo:"hp-watcher",token:"",cooldown:60};
var configData={},historyData={recent_runs:[]},configSha="";
function readStore(){try{var saved=JSON.parse(localStorage.getItem("hpw.cfg")||"{}");Object.keys(saved).forEach(function(k){cfg[k]=saved[k];});}catch(e){}}
function writeStore(){try{localStorage.setItem("hpw.cfg",JSON.stringify(cfg));}catch(e){}}
function message(id,text,kind){var e=$(id);e.textContent=text||"";e.className="msg"+(kind?" "+kind:"");}
function normalUrl(value){var v=String(value||"").trim();if(!v)return null;if(!/^https?:\/\//i.test(v)){if(/^[a-z][a-z0-9+.-]*:/i.test(v))return null;v="https://"+v;}try{var u=new URL(v);if(!/^https?:$/.test(u.protocol)||u.hostname==="localhost"||/^(127\.|10\.|192\.168\.|169\.254\.)/.test(u.hostname))return null;u.hash="";if(u.pathname.length>1)u.pathname=u.pathname.replace(/\/+$/,"");return u.toString();}catch(e){return null;}}
function api(path){return "https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+path;}
function headers(){return {Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json"};}
function decode(content){return JSON.parse(decodeURIComponent(escape(atob(content.replace(/\s/g,"")))));}
function pull(path){return fetch(api(path),{headers:headers()}).then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error(e.message||("HTTP "+r.status));});return r.json();}).then(function(d){return {sha:d.sha,data:decode(d.content)};});}
function saveConfig(next){if(!configSha)return Promise.reject(new Error("設定を再読み込みしてください。"));var b64=btoa(unescape(encodeURIComponent(JSON.stringify(next,null,2)+"\n")));return fetch(api("config.json"),{method:"PUT",headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({message:"監視設定を更新",content:b64,sha:configSha})}).then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error(e.message||("設定が更新されています。更新ボタンを押してから再操作してください。"));});return r.json();}).then(function(d){configData=next;configSha=(d.content&&d.content.sha)||configSha;});}
function loadAll(){return Promise.all([pull("config.json"),pull("history.json")]).then(function(all){configData=all[0].data||{};configSha=all[0].sha||"";historyData=all[1].data||{recent_runs:[]};render();});}
function currentUrls(){return (configData.target_urls||[]).map(normalUrl).filter(function(v,i,a){return v&&a.indexOf(v)===i;});}
function notified(){return (configData.notified_urls||[]).filter(function(x){return x&&normalUrl(x.url);});}
function row(text,meta,buttons){var r=document.createElement("div"),l=document.createElement("div"),u=document.createElement("div"),m=document.createElement("div"),a=document.createElement("div");r.className="row";l.style.flex="1";u.className="url";u.textContent=text;m.className="meta";m.textContent=meta||"";l.appendChild(u);if(meta)l.appendChild(m);a.className="actions";(buttons||[]).forEach(function(b){var x=document.createElement("button");x.className="btn btn-small "+(b.danger?"btn-danger":"btn-line");x.textContent=b.label;x.onclick=b.action;a.appendChild(x);});r.appendChild(l);r.appendChild(a);return r;}
function empty(container,text){container.innerHTML="";var e=document.createElement("div");e.className="empty";e.textContent=text;container.appendChild(e);}
function render(){var urls=currentUrls(),done=notified();$("n-active").textContent=urls.length;$("n-notified").textContent=done.length;$("summary").textContent="30分ごとに10件ずつ。ページの続きは次回以降に巡回します。";var active=$("list-active");active.innerHTML="";if(!urls.length)empty(active,"監視URLはありません。");urls.forEach(function(url){active.appendChild(row(url,"通知対象の番号を検知したら「通知済み」へ移動",[{label:"削除",danger:true,action:function(){removeActive(url);}}]));});var nlist=$("list-notified");nlist.innerHTML="";if(!done.length)empty(nlist,"通知済みURLはありません。");done.forEach(function(item){var date=item.notified_at?new Date(item.notified_at).toLocaleString("ja-JP"):"日時不明";var phones=(item.phones||[]).join("、")||"番号情報なし";nlist.appendChild(row(normalUrl(item.url),date+" / "+phones,[{label:"監視に戻す",action:function(){restore(item.url);}},{label:"削除",danger:true,action:function(){removeNotified(item.url);}}]));});renderRecent();}
function renderRecent(){var list=$("list-recent");list.innerHTML="";var since=Date.now()-24*60*60*1000;var rows=(historyData.recent_runs||[]).filter(function(x){return new Date(x.at).getTime()>=since;}).sort(function(a,b){return new Date(b.at)-new Date(a.at);});$("n-recent").textContent=rows.length+"件";if(!rows.length){empty(list,"直近24時間の巡回履歴はまだありません。");return;}rows.slice(0,100).forEach(function(x){var r=document.createElement("div"),left=document.createElement("div"),top=document.createElement("div"),meta=document.createElement("div"),badge=document.createElement("span");r.className="row";left.style.flex="1";top.className="url";top.textContent=x.url;badge.className="badge"+(x.result.indexOf("error")>=0?" err":x.result.indexOf("suspect")>=0?" warn":"");badge.textContent=x.result;meta.className="meta";meta.textContent=new Date(x.at).toLocaleString("ja-JP")+" / "+(x.pages||0)+"ページ"+(x.phones&&x.phones.length?" / "+x.phones.join("、"):"")+(x.error?" / "+x.error:"");left.appendChild(top);left.appendChild(meta);r.appendChild(left);r.appendChild(badge);list.appendChild(r);});}
function setTab(name){$("tab-active").classList.toggle("on",name==="active");$("tab-notified").classList.toggle("on",name==="notified");$("box-active").classList.toggle("hide",name!=="active");$("box-notified").classList.toggle("hide",name!=="notified");}
function addValues(raw,button,clearId){var next=currentUrls(),max=parseInt(configData.max_target_urls,10)||120,added=0;String(raw||"").split(/[\n,]+/).forEach(function(v){var u=normalUrl(v);if(u&&next.indexOf(u)<0&&next.length<max){next.push(u);added++;}});if(!added){message("msg-url","追加できる新しいURLがありません。形式・重複・120件上限を確認してください。","bad");return;}button.disabled=true;button.textContent="保存中...";var nextCfg=Object.assign({},configData,{target_urls:next});saveConfig(nextCfg).then(function(){if(clearId)$(clearId).value="";message("msg-url",added+"件追加しました。次の巡回から対象です。","good");render();}).catch(function(e){message("msg-url","保存に失敗しました: "+e.message,"bad");}).then(function(){button.disabled=false;button.textContent=button.id==="btn-bulk"?"まとめて追加":"追加";});}
function removeActive(url){if(!confirm("監視URLを削除しますか？"))return;var next=Object.assign({},configData,{target_urls:currentUrls().filter(function(x){return x!==url;})});saveConfig(next).then(render).catch(function(e){alert("削除に失敗: "+e.message);});}
function removeNotified(url){if(!confirm("通知済みURLを削除しますか？巡回履歴は24時間分だけ残ります。"))return;var next=Object.assign({},configData,{notified_urls:notified().filter(function(x){return normalUrl(x.url)!==normalUrl(url);})});saveConfig(next).then(render).catch(function(e){alert("削除に失敗: "+e.message);});}
function restore(url){if(!confirm("このURLを通常の監視へ戻しますか？次回からページ探索をやり直します。"))return;var normalized=normalUrl(url),urls=currentUrls();if(urls.indexOf(normalized)<0)urls.push(normalized);var next=Object.assign({},configData,{target_urls:urls,notified_urls:notified().filter(function(x){return normalUrl(x.url)!==normalized;})});saveConfig(next).then(render).catch(function(e){alert("復帰に失敗: "+e.message);});}
function connect(){cfg.owner=$("in-owner").value.trim();cfg.repo=$("in-repo").value.trim()||"hp-watcher";cfg.token=$("in-token").value.trim();cfg.cooldown=parseInt($("in-cooldown").value,10)||60;if(!cfg.owner||!cfg.token){message("msg-setup","GitHubユーザー名とトークンを入力してください。","bad");return;}var b=$("btn-connect");b.disabled=true;b.textContent="接続中...";loadAll().then(function(){writeStore();$("setup").classList.add("hide");$("main").classList.remove("hide");}).catch(function(e){message("msg-setup","接続できません: "+e.message,"bad");}).then(function(){b.disabled=false;b.textContent="接続してはじめる";});}
readStore();$("in-owner").value=cfg.owner;$("in-repo").value=cfg.repo;$("in-token").value=cfg.token;$("in-cooldown").value=cfg.cooldown;$("btn-connect").onclick=connect;$("btn-refresh").onclick=function(){loadAll().catch(function(e){alert("更新に失敗: "+e.message);});};$("btn-add").onclick=function(){addValues($("in-url").value,$("btn-add"),"in-url");};$("btn-bulk").onclick=function(){addValues($("in-bulk").value,$("btn-bulk"),"in-bulk");};$("tab-active").onclick=function(){setTab("active");};$("tab-notified").onclick=function(){setTab("notified");};$("in-url").onkeydown=function(e){if(e.key==="Enter")$("btn-add").click();};if(cfg.owner&&cfg.token){$("setup").classList.add("hide");$("main").classList.remove("hide");loadAll().catch(function(){});}
})();
</script></body></html>
