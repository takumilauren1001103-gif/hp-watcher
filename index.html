<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HP監視システム</title>
<style>
:root{
  --bg:#faf9f7; --card:#ffffff; --line:#e3e1dc; --ink:#1c1b19;
  --dim:#6b6862; --faint:#9a968e; --go:#0d7d5f; --stop:#b03a2e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  line-height:1.7; padding:0 16px 60px;
}
.wrap{max-width:640px;margin:0 auto}

/* ヘッダ */
header{padding:36px 0 20px;border-bottom:2px solid var(--ink);margin-bottom:28px}
h1{font-size:21px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--go);flex:none}
header p{font-size:13px;color:var(--dim);margin-top:5px}

/* カード */
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.box-t{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.box-b{padding:16px}

/* フォーム */
label{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:5px}
input{
  width:100%;padding:11px 13px;font-size:15px;font-family:inherit;
  border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);
}
input:focus{outline:2px solid var(--go);outline-offset:-1px;border-color:transparent}
.fld{margin-bottom:18px}
.fld:last-child{margin-bottom:0}
.note{font-size:12px;color:var(--faint);margin-top:5px;line-height:1.7}
.two{display:flex;gap:12px}
.two>*{flex:1}

/* ボタン */
button{
  font-family:inherit;font-size:14px;font-weight:600;
  border:none;border-radius:7px;cursor:pointer;padding:11px 20px;
  white-space:nowrap;
}
.go{background:var(--go);color:#fff}
.go:disabled{opacity:.45;cursor:default}
.full{width:100%}
.mini{background:none;color:var(--stop);font-size:12px;padding:5px 9px;font-weight:500}
.line-btn{background:none;color:var(--dim);border:1px solid var(--line);font-size:13px;padding:7px 13px}

/* リスト */
.row{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.row:last-child{border-bottom:none}
.row span{font-size:14px;word-break:break-all;flex:1}
.void{padding:36px 16px;text-align:center;color:var(--faint);font-size:14px}

/* 通知 */
.msg{font-size:13px;margin-top:8px;min-height:1px}
.msg.bad{color:var(--stop)}
.msg.good{color:var(--go)}
#flash{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 22px;border-radius:7px;
  font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;
}
#flash.on{opacity:1}

/* 流れ図 */
.flow{
  border:1px dashed var(--line);border-radius:10px;padding:16px;
  font-size:13px;color:var(--dim);text-align:center;line-height:2.3;
}
.flow b{color:var(--ink)}

/* 致命的エラー表示 */
#crash{
  display:none;background:#fdf0ee;border:1px solid var(--stop);color:var(--stop);
  border-radius:8px;padding:14px 16px;font-size:13px;margin:20px 0;
  font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;
}
.hide{display:none !important}
</style>
</head>
<body>
<div class="wrap">

<div id="crash"></div>

<!-- ===== 設定画面（初期表示。JSが死んでもここは見える） ===== -->
<section id="setup">
  <header>
    <h1><span class="dot"></span>HP監視システム</h1>
    <p>初期設定 — GitHubと接続します</p>
  </header>

  <div class="box"><div class="box-b">
    <div class="fld">
      <label>GitHubユーザー名</label>
      <input type="text" id="in-owner" placeholder="takumilauren1001103-gif" autocomplete="off">
      <div class="note">github.com/<b>ここ</b>/hp-watcher の部分</div>
    </div>

    <div class="fld">
      <label>リポジトリ名</label>
      <input type="text" id="in-repo" value="hp-watcher" autocomplete="off">
    </div>

    <div class="fld">
      <label>Personal Access Token</label>
      <input type="password" id="in-token" placeholder="github_pat_..." autocomplete="off">
      <div class="note">GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens で発行。Contents を Read and write に。</div>
    </div>

    <div class="fld two">
      <div>
        <label>巡回間隔（分）</label>
        <input type="number" id="in-interval" value="10" min="5" max="60">
      </div>
      <div>
        <label>再通知抑止（分）</label>
        <input type="number" id="in-cooldown" value="60" min="5" max="1440">
      </div>
    </div>

    <button class="go full" id="btn-connect" style="margin-top:18px">接続してはじめる</button>
    <div class="msg" id="msg-setup"></div>
  </div></div>
</section>

<!-- ===== メイン画面 ===== -->
<section id="main" class="hide">
  <header>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div>
        <h1><span class="dot"></span>HP監視システム</h1>
        <p>電話番号が掲載されたら Telegram に通知</p>
      </div>
      <button class="line-btn" id="btn-config">設定</button>
    </div>
  </header>

  <div class="box"><div class="box-b">
    <label>監視URLを追加</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="in-url" placeholder="https://example.com/" autocomplete="off">
      <button class="go" id="btn-add">追加</button>
    </div>
    <div class="msg" id="msg-url"></div>
  </div></div>

  <div class="box">
    <div class="box-t">
      <span>監視中（<span id="n-urls">0</span>件）</span>
      <span style="font-weight:400;color:var(--faint)" id="lbl-interval"></span>
    </div>
    <div id="list-urls"></div>
  </div>

  <div class="box hide" id="box-log">
    <div class="box-t"><span>操作ログ</span></div>
    <div id="list-log"></div>
  </div>

  <div class="flow">
    新規HP発見 → <b>この画面でURL入力</b> → 自動巡回 → 携帯番号を検知 → Telegram通知
  </div>
</section>

</div>
<div id="flash"></div>

<script>
"use strict";

// 何が起きても画面に出す
window.onerror = function(m, s, l, c, e) {
  var box = document.getElementById("crash");
  box.style.display = "block";
  box.textContent = "エラーが発生しました:\n" + m + "\n(" + l + ":" + c + ")";
  return false;
};

(function () {
  var $ = function (id) { return document.getElementById(id); };

  var cfg = { owner: "", repo: "hp-watcher", token: "", interval: 10, cooldown: 60 };
  var urls = [];
  var logs = [];

  // ---------- 保存 ----------
  function readStore() {
    try {
      var a = localStorage.getItem("hpw.cfg");
      if (a) { var o = JSON.parse(a); for (var k in o) cfg[k] = o[k]; }
      var b = localStorage.getItem("hpw.log");
      if (b) logs = JSON.parse(b) || [];
    } catch (e) {}
  }
  function writeStore() {
    try {
      localStorage.setItem("hpw.cfg", JSON.stringify(cfg));
      localStorage.setItem("hpw.log", JSON.stringify(logs));
    } catch (e) {}
  }

  // ---------- 表示 ----------
  function flash(t) {
    var f = $("flash");
    f.textContent = t; f.classList.add("on");
    setTimeout(function () { f.classList.remove("on"); }, 2600);
  }
  function say(id, text, kind) {
    var el = $(id);
    el.textContent = text || "";
    el.className = "msg" + (kind ? " " + kind : "");
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m];
    });
  }

  function toSetup() {
    $("setup").classList.remove("hide");
    $("main").classList.add("hide");
    $("in-owner").value = cfg.owner;
    $("in-repo").value = cfg.repo;
    $("in-token").value = cfg.token;
    $("in-interval").value = cfg.interval;
    $("in-cooldown").value = cfg.cooldown;
  }
  function toMain() {
    $("setup").classList.add("hide");
    $("main").classList.remove("hide");
    drawUrls(); drawLogs();
  }

  function drawUrls() {
    $("n-urls").textContent = urls.length;
    $("lbl-interval").textContent = cfg.interval + "分ごとに巡回";
    var box = $("list-urls");
    if (!urls.length) {
      box.innerHTML = '<div class="void">URLを追加してください</div>';
      return;
    }
    var h = "";
    for (var i = 0; i < urls.length; i++) {
      h += '<div class="row"><span>' + esc(urls[i]) +
           '</span><button class="mini" data-i="' + i + '">削除</button></div>';
    }
    box.innerHTML = h;
    var bs = box.querySelectorAll("button[data-i]");
    for (var j = 0; j < bs.length; j++) {
      bs[j].onclick = function () { dropUrl(parseInt(this.getAttribute("data-i"), 10)); };
    }
  }

  function drawLogs() {
    if (!logs.length) { $("box-log").classList.add("hide"); return; }
    $("box-log").classList.remove("hide");
    var h = "";
    for (var i = 0; i < Math.min(logs.length, 8); i++) {
      h += '<div class="row"><span style="font-size:13px;color:var(--dim)">' +
           '<span style="color:var(--faint);font-size:12px;margin-right:8px">' +
           esc(logs[i].t) + "</span>" + esc(logs[i].m) + "</span></div>";
    }
    $("list-log").innerHTML = h;
  }

  function note(m) {
    logs.unshift({ t: new Date().toLocaleString("ja-JP"), m: m });
    logs = logs.slice(0, 30);
    writeStore(); drawLogs();
  }

  // ---------- GitHub ----------
  function api() {
    return "https://api.github.com/repos/" + cfg.owner + "/" + cfg.repo + "/contents/config.json";
  }
  function head() {
    return { Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github+json" };
  }

  function pull() {
    return fetch(api(), { headers: head() }).then(function (r) {
      if (!r.ok) return r.json().then(function (e) { throw new Error(e.message || ("HTTP " + r.status)); });
      return r.json();
    }).then(function (d) {
      var raw = decodeURIComponent(escape(atob(d.content.replace(/\s/g, ""))));
      return { sha: d.sha, data: JSON.parse(raw) };
    });
  }

  function push(list) {
    var body = {
      target_urls: list,
      check_interval_minutes: cfg.interval,
      notification_cooldown_minutes: cfg.cooldown
    };
    var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(body, null, 2) + "\n")));
    return fetch(api(), { headers: head() })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (cur) {
        var payload = { message: "監視URL更新", content: b64 };
        if (cur && cur.sha) payload.sha = cur.sha;
        return fetch(api(), {
          method: "PUT",
          headers: { Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      })
      .then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.message || ("HTTP " + r.status)); });
        return true;
      });
  }

  // ---------- 操作 ----------
  function connect() {
    cfg.owner = $("in-owner").value.trim();
    cfg.repo = $("in-repo").value.trim() || "hp-watcher";
    cfg.token = $("in-token").value.trim();
    cfg.interval = parseInt($("in-interval").value, 10) || 10;
    cfg.cooldown = parseInt($("in-cooldown").value, 10) || 60;

    if (!cfg.owner) { say("msg-setup", "GitHubユーザー名を入力してください", "bad"); return; }
    if (!cfg.token) { say("msg-setup", "トークンを入力してください", "bad"); return; }

    var b = $("btn-connect");
    b.disabled = true; b.textContent = "接続中...";
    say("msg-setup", "");

    pull().then(function (res) {
      urls = res.data.target_urls || [];
      if (res.data.check_interval_minutes) cfg.interval = res.data.check_interval_minutes;
      if (res.data.notification_cooldown_minutes) cfg.cooldown = res.data.notification_cooldown_minutes;
      writeStore(); toMain(); flash("接続しました");
    }).catch(function (err) {
      say("msg-setup", "接続できません: " + err.message, "bad");
    }).then(function () {
      b.disabled = false; b.textContent = "接続してはじめる";
    });
  }

  function addUrl() {
    var v = $("in-url").value.trim();
    if (!v) { say("msg-url", "URLを入力してください", "bad"); return; }
    if (v.indexOf("http") !== 0) v = "https://" + v;
    try { new URL(v); } catch (e) { say("msg-url", "URLの形式が正しくありません", "bad"); return; }
    if (urls.indexOf(v) >= 0) { say("msg-url", "すでに登録されています", "bad"); return; }

    var b = $("btn-add");
    b.disabled = true; b.textContent = "···";
    say("msg-url", "");

    var next = urls.concat([v]);
    push(next).then(function () {
      urls = next; $("in-url").value = "";
      note("追加 " + v); drawUrls();
      flash("追加しました。次の巡回から監視します");
    }).catch(function (err) {
      say("msg-url", "GitHubへの書き込みに失敗: " + err.message, "bad");
    }).then(function () {
      b.disabled = false; b.textContent = "追加";
    });
  }

  function dropUrl(i) {
    var target = urls[i];
    var next = urls.filter(function (_, k) { return k !== i; });
    push(next).then(function () {
      urls = next; note("削除 " + target); drawUrls(); flash("削除しました");
    }).catch(function (err) {
      flash("削除に失敗: " + err.message);
    });
  }

  // ---------- 起動 ----------
  readStore();

  $("btn-connect").onclick = connect;
  $("btn-add").onclick = addUrl;
  $("btn-config").onclick = toSetup;
  $("in-url").onkeydown = function (e) { if (e.key === "Enter") addUrl(); };
  $("in-token").onkeydown = function (e) { if (e.key === "Enter") connect(); };

  if (cfg.owner && cfg.token) {
    toMain();
    pull().then(function (res) {
      urls = res.data.target_urls || [];
      drawUrls();
    }).catch(function () {});
  } else {
    toSetup();
  }
})();
</script>
</body>
</html>
